<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Calculadora</title>
    </head>
    <body>

        <div class="calculator">
            <h1>Mini Calculator</h1>

            <input type="number" id="number1" placeholder="Number 1">
            <input type="number" id="number2" placeholder="Number 2">

            <div>
                <button id="btnAdd">➕ Add</button>
                <button id="btnSubtract">➖ Subtract</button>
                <button id="btnMultiply">✖️ Multiply</button>
                <button id="btnDivide"> ➗ Divide</button>
            </div>

            <p id="result"></p>
        </div>
        
        <script src="script.js"></script>

    </body>
</html>
