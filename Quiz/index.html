<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🎯 Juego de Trivia</h1>
    <div id="scoreboard">
      <p id="score">Puntos: 0</p>
      <p id="questionCount">Pregunta: 0</p>
    </div>
    <div id="questionBox">
      <h2 id="question">Cargando pregunta...</h2>
      <div id="options"></div>
    </div>
    <button id="nextBtn">Siguiente ➡️</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
