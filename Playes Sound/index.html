<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Mini Sound Player</title>
    </head>
    <body>
        <div id="container">
            <h1>🎶 Mini Sound Player</h1>
            <div>
                <button data-sound="applause">Applause</button>
                <button data-sound="drum">Drum</button>
                <button data-sound="bell">Bell</button>
                <button data-sound="laugh">Laugh</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
