<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronómetro y Temporizador</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>⏱️ Cronómetro & Temporizador ⏳</h1>

    <div id="display">00:00:00</div>

    <div class="mode">
      <label>
        <input type="radio" name="mode" value="stopwatch" checked> Cronómetro
      </label>
      <label>
        <input type="radio" name="mode" value="countdown"> Temporizador
      </label>
    </div>

    <div id="timeInput" style="display:none;">
      <input type="number" id="hoursInput" min="0" max="23" placeholder="HH">
      <input type="number" id="minutesInput" min="0" max="59" placeholder="MM">
      <input type="number" id="secondsInput" min="0" max="59" placeholder="SS">
    </div>

    <div id="progressContainer" style="display:none;">
      <div id="progressBar"></div>
    </div>

    <div class="buttons">
      <button id="start">▶️ Iniciar</button>
      <button id="pause">⏸️ Pausar</button>
      <button id="reset">⏹️ Resetear</button>
    </div>
  </div>

  <audio id="alarmSound" src="cobra.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
